<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPM | Syeikh Prompt Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sf-container">
        <!-- TOP NAVIGATION (APPLE STYLE) -->
        <nav class="sf-nav">
            <div class="nav-content">
                <span class="system-status">● SPM Console v2.0</span>
                <span class="org-name">State of Protocol</span>
            </div>
        </nav>

        <header class="sf-header">
            <h1>Syeikh Prompt Master</h1>
            <p>Sistem Kejuruteraan Prompt Gred-Industri</p>
        </header>

        <main class="sf-main">
            <!-- INPUT SECTION -->
            <section class="cli-window">
                <div class="window-header">
                    <div class="dots">
                        <span class="dot red"></span>
                        <span class="dot yellow"></span>
                        <span class="dot green"></span>
                    </div>
                    <div class="window-title">input_parameters.sh</div>
                </div>
                
                <div class="window-body">
                    <div class="cli-group">
                        <label>IDENTITI PENGGUNA</label>
                        <div class="cli-input-row">
                            <span class="prompt-char">~</span>
                            <input type="text" id="fullName" placeholder="Nama Penuh" class="live-input">
                        </div>
                        <div class="cli-input-row">
                            <span class="prompt-char">~</span>
                            <input type="date" id="dob" class="live-input">
                        </div>
                    </div>

                    <div class="cli-group">
                        <label>RUJUKAN STRATEGIK (IDOLA)</label>
                        <div class="cli-input-row">
                            <span class="prompt-char">#</span>
                            <input type="text" id="idol" placeholder="Elon Musk / Tun M" class="live-input">
                            <button id="researchIdolBtn" class="cli-btn-action">SEARCH</button>
                        </div>
                    </div>

                    <div class="cli-group">
                        <label>BIDANG INDUSTRI (TICK MODE)</label>
                        <div class="industry-selector">
                            <label class="cli-checkbox"><input type="checkbox" name="industry" value="Digital & AI" class="live-check"> <span>Digital & AI</span></label>
                            <label class="cli-checkbox"><input type="checkbox" name="industry" value="FinTech" class="live-check"> <span>FinTech</span></label>
                            <label class="cli-checkbox"><input type="checkbox" name="industry" value="GreenTech" class="live-check"> <span>GreenTech</span></label>
                            <label class="cli-checkbox"><input type="checkbox" name="industry" value="Cybersecurity" class="live-check"> <span>Cybersecurity</span></label>
                            <label class="cli-checkbox"><input type="checkbox" name="industry" value="Global Strategy" class="live-check"> <span>Strategy</span></label>
                        </div>
                    </div>

                    <div class="cli-group">
                        <label>TUGASAN UTAMA</label>
                        <textarea id="task" placeholder="Huraikan tugasan anda..." class="live-input"></textarea>
                    </div>

                    <div class="cli-group">
                        <div class="cli-grid-2">
                            <select id="format" class="live-input">
                                <option value="Step-by-Step">--format=step</option>
                                <option value="Table">--format=table</option>
                                <option value="Analytical">--format=essay</option>
                            </select>
                            <select id="tone" class="live-input">
                                <option value="Professional">--tone=pro</option>
                                <option value="Creative">--tone=creative</option>
                                <option value="Technical">--tone=tech</option>
                            </select>
                        </div>
                    </div>
                </div>
            </section>

            <!-- OUTPUT SECTION (TERMINAL STYLE) -->
            <section class="cli-window terminal-window">
                <div class="window-header">
                    <div class="window-title">prompt_output.log</div>
                    <div class="window-controls">
                        <label class="live-toggle">
                            <input type="checkbox" id="liveToggle" checked>
                            <span class="toggle-text">LIVE_PREVIEW</span>
                        </label>
                        <button id="copyBtn" class="cli-btn-primary">COPY_BUFFER</button>
                    </div>
                </div>
                <div class="window-body">
                    <pre id="promptOutput" class="terminal-text">Initializing Syeikh Prompt Master...</pre>
                </div>
            </section>
        </main>

        <footer class="sf-footer">
            <p>DESIGNED BY STATE OF PROTOCOL IN CALIFORNIA (VIRTUAL)</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
