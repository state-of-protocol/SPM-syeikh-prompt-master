<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPM | Syeikh Prompt Master v3.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <!-- GLOBAL STATUS BAR -->
        <nav class="sf-nav">
            <div class="nav-content">
                <span class="status-indicator">● SPM_SENTINEL_ACTIVE</span>
                <span class="system-time" id="uptimeCounter">00:00:00</span>
            </div>
        </nav>

        <!-- STRATEGIC DASHBOARD -->
        <header class="sf-dashboard card">
            <div class="dash-grid">
                <div class="stat-box">
                    <label>DAILY_TARGET</label>
                    <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
                    <span id="progressText" class="value">$250.00 USD</span>
                </div>
                <div class="stat-box">
                    <label>ACTIVE_NICHE</label>
                    <span class="value accent">AI_SURGEON</span>
                </div>
                <div class="stat-box">
                    <label>PIPELINE_VALUE</label>
                    <span id="valuationBadge" class="value green">$0.00</span>
                </div>
            </div>
        </header>

        <main class="sf-main">
            <!-- UNIFIED INPUT MODULE -->
            <section class="cli-container card">
                <div class="cli-header">
                    <div class="cli-dots"><span class="red"></span><span class="yellow"></span><span class="green"></span></div>
                    <span class="cli-title">terminal.spm</span>
                </div>
                <div class="cli-body">
                    <div class="input-group">
                        <label>STRATEGIC_COMMAND</label>
                        <div class="cli-row">
                            <span class="char">></span>
                            <input type="text" id="task" placeholder="Execute command..." class="live-input">
                        </div>
                    </div>
                    
                    <div class="options-grid">
                        <div class="option-item">
                            <label>PERSONA</label>
                            <input type="text" id="idol" placeholder="Elon Musk" class="live-input small">
                        </div>
                        <div class="option-item">
                            <label>INDUSTRY_TICK</label>
                            <div class="tick-group">
                                <label class="tick"><input type="checkbox" name="industry" value="Digital" class="live-check"> <span>Digi</span></label>
                                <label class="tick"><input type="checkbox" name="industry" value="Fintech" class="live-check"> <span>Fin</span></label>
                                <label class="tick"><input type="checkbox" name="industry" value="AI" class="live-check"> <span>AI</span></label>
                                <label class="tick"><input type="checkbox" name="industry" value="Cyber" class="live-check"> <span>Cyber</span></label>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- CONSOLE OUTPUT -->
            <section class="console-container card">
                <div class="console-header">
                    <span class="console-title">output_stream.log</span>
                    <button id="copyBtn" class="btn-copy">COPY_RAW</button>
                </div>
                <div class="console-body">
                    <pre id="promptOutput" class="console-text">$ initialization successful. sentinel online.</pre>
                </div>
            </section>
        </main>

        <footer class="sf-footer">
            <p>DESIGNED BY STATE OF PROTOCOL | LEAN & MEAN EDITION</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
